spring.profiles.active: develop
spring.jpa.open-in-view: false
server:
  port: 8090
---
spring.config.activate.on-profile: develop
spring:
  jpa:
    show_sql: false
    database: H2
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:wallet;DB_CLOSE_ON_EXIT=FALSE;IGNORECASE=TRUE
stripe.simulator.charges-uri: https://sandbox.playtomic.io/v1/stripe-simulator/charges
stripe.simulator.refunds-uri: https://sandbox.playtomic.io/v1/stripe-simulator/payments/{payment_id}/refunds
stripe.simulator.connect-timeout: 2s
stripe.simulator.read-timeout: 5s
---
spring.config.activate.on-profile: test
spring:
  jpa:
    show_sql: false
    database: H2
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:wallet-test;DB_CLOSE_ON_EXIT=FALSE;IGNORECASE=TRUE
stripe.simulator.charges-uri: http://localhost:9999
stripe.simulator.refunds-uri: http://localhost:9999
stripe.simulator.connect-timeout: 1s
stripe.simulator.read-timeout: 1s